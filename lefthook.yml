# Lefthook config for the Paper 1 release bundle.
#
# This repo (github.com/epicsagas/ai-production-function) is a standalone
# distribution bundle, generated by the vault's build/export_release.py. It must
# NEVER carry vault-specific metadata: no Obsidian YAML frontmatter (tags: [...])
# and no [[wikilinks]], because these leak into the built PDF and expose the
# private vault structure.
#
# obsidian-forge's watch daemon (of watch) auto-injects frontmatter and a
# `[[04-Writing/04-Writing]]` See Also link into any .md it scans, and its
# vault.toml `exclude` only matches top-level dirs — so the nested release/
# bundles are not actually excluded (obsidian-forge 0.3.0 bug). These hooks are
# the hard gate that blocks such leaks at commit time regardless of the daemon.
#
# pre-commit hooks guard against vault metadata (frontmatter, wikilinks)
# leaking into the public bundle. (Earlier-paper/later-paper leak detection
# runs in the vault-side export pipeline, not here, because the tripwire
# keywords themselves would be a leak in a shipped file.)

pre-commit:
  commands:
    no-vault-frontmatter:
      tags: lint
      env:
        CI: "1"
        CI_HOOK: "1"
      run: |
        exec </dev/null
        # Reject any staged .md whose FIRST non-empty line is YAML frontmatter `---`
        # (release docs intentionally have none) — the obsidian-forge injection signature.
        leak=0
        for f in $(git diff --cached --name-only --diff-filter=ACM -- '*.md'); do
          if head -n 1 "$f" 2>/dev/null | grep -qE '^---[[:space:]]*$'; then
            echo "BLOCKED: $f starts with YAML frontmatter (---) — vault metadata must not enter the release." >&2
            leak=1
          fi
        done
        exit $leak

    no-vault-wikilinks:
      tags: lint
      env:
        CI: "1"
        CI_HOOK: "1"
      run: |
        exec </dev/null
        # Reject `[[...]]` Obsidian wikilinks anywhere in staged .md files.
        leak=0
        for f in $(git diff --cached --name-only --diff-filter=ACM -- '*.md'); do
          if grep -nE '\[\[[^]]+\]\]' "$f" 2>/dev/null | grep -q .; then
            echo "BLOCKED: $f contains an Obsidian [[wikilink]] — not valid in a public release." >&2
            grep -nE '\[\[[^]]+\]\]' "$f" >&2
            leak=1
          fi
        done
        exit $leak
